# pyproject.toml
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veyra"
version = "0.1.0"
description = "Plateforme de sécurité locale, modulaire et adaptative (reconnaissance faciale, surveillance d'activité, verrouillage de session)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "PySide6>=6.7,<7",
    "opencv-python>=4.9,<5",
    "onnxruntime>=1.17,<2",
    "numpy>=1.26,<3",
    "pynput>=1.7.6,<2",
    "cryptography>=42,<47",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]

[project.scripts]
veyra = "veyra.app.main:main"

[tool.setuptools.packages.find]
include = ["veyra*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
